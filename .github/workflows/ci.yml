name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # versión desde "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    # macOS: es la plataforma que se distribuye. En Linux, el Chromium headless con
    # GL por software se bloquea al crear la segunda terminal (no es la app:
    # E2E_PLATFORM=linux en macOS pasa completo).
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chrome viene preinstalado en el runner; las pruebas levantan su propio Vite.
      - run: pnpm e2e
        env:
          E2E_DIAG: "1"
      - name: Capturas de e2e fallidas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts/
          if-no-files-found: ignore

  rust:
    # macOS: los tests del PTY usan proc_pidinfo y Tauri no necesita dependencias de sistema.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! necesita el frontend compilado en dist/.
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Umbrales holgados (los runners varían): atrapan regresiones graves, no ruido.
      - name: Benchmark del PTY
        shell: bash
        run: |
          cargo run --release -p pty-core --example bench -- --mib 128 --json --min-mbps 15 --max-p99-ms 25 | tee bench.json
          {
            echo "### Benchmark de pty-core"
            echo
            echo '| Métrica | Valor |'
            echo '|---|---|'
            jq -r 'to_entries[] | "| \(.key) | \(.value) |"' bench.json
          } >> "$GITHUB_STEP_SUMMARY"
