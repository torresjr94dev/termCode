name: Release

# git tag v0.2.0 && git push --tags → borrador de release con el .dmg universal
# y los instaladores de Windows (NSIS .exe y .msi). Los archivos no llevan la
# versión en el nombre (termCode_universal.dmg, termCode_x64-setup.exe), así
# releases/latest/download/<archivo> siempre baja la última versión publicada.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # El borrador se crea antes de compilar: si cada job lo creara al terminar y
  # coincidieran, saldrían dos borradores con la misma etiqueta. Si ya existe
  # (re-ejecución), se reutiliza.
  draft:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | "\(.tag_name)\t\(.id)"' \
            | awk -F'\t' -v tag="$TAG" '$1 == tag { print $2; exit }')
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="termCode $TAG" -F draft=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  macos:
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # Actualizaciones automáticas: solo si existen la llave privada (secreto) y
      # la pública (variable del repo). Sin ellas la release sale igual, sin updater.
      - name: Configurar el updater
        id: updater
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PRIVATE_KEY" ] || [ -z "$PUBKEY" ]; then
            echo "::warning::Sin TAURI_SIGNING_PRIVATE_KEY o TAURI_UPDATER_PUBKEY: esta release no se actualizará sola."
            exit 0
          fi
          conf="$RUNNER_TEMP/updater.conf.json"
          jq -n --arg pubkey "$PUBKEY" --arg url "https://github.com/$REPO/releases/latest/download/latest.json" \
            '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $pubkey, endpoints: [$url]}}}' > "$conf"
          echo "args=--config $conf" >> "$GITHUB_OUTPUT"
      # Firma + notarización. Las APPLE_* solo se exportan si hay certificado:
      # Tauri da por definida una variable vacía e intentaría importar un
      # certificado vacío. Sin certificado se firma ad hoc ("-"), que Apple
      # Silicon exige a las apps descargadas; Gatekeeper pedirá abrirla desde
      # Ajustes → Privacidad y seguridad.
      - name: Configurar la firma de Apple
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::Sin APPLE_CERTIFICATE: el .dmg sale con firma ad hoc y sin notarizar."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || continue
            delim="EOF_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delim" "${!name}" "$delim" >> "$GITHUB_ENV"
          done
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de los artefactos de actualización (minisign).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          releaseAssetNamePattern: "[name]_[arch][setup][ext]"
          args: --target universal-apple-darwin ${{ steps.updater.outputs.args }}

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Configurar el updater
        id: updater
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          REPO: ${{ github.repository }}
        run: |
          # Firma Authenticode: los certificados nuevos viven en un HSM (regla del
          # CA/B Forum de 2023), no en un .pfx que quepa en un secreto. Hasta
          # configurar un firmador (p. ej. Azure Trusted Signing con
          # bundle.windows.signCommand), el instalador sale sin firmar.
          echo "::warning::El instalador de Windows sale sin firma Authenticode: SmartScreen avisará al instalarlo."
          if [ -z "$PRIVATE_KEY" ] || [ -z "$PUBKEY" ]; then
            echo "::warning::Sin TAURI_SIGNING_PRIVATE_KEY o TAURI_UPDATER_PUBKEY: esta release no se actualizará sola."
            exit 0
          fi
          conf="$(cygpath -m "$RUNNER_TEMP")/updater.conf.json"
          jq -n --arg pubkey "$PUBKEY" --arg url "https://github.com/$REPO/releases/latest/download/latest.json" \
            '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $pubkey, endpoints: [$url]}}}' > "$conf"
          echo "args=--config $conf" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          releaseAssetNamePattern: "[name]_[arch][setup][ext]"
          # La landing enlaza el instalador NSIS; el updater usa el mismo.
          updaterJsonPreferNsis: true
          args: ${{ steps.updater.outputs.args }}
