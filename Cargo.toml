[workspace]
resolver = "3"
members = ["src-tauri", "crates/pty-core"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
# The oldest Rust that builds every dependency (Tauri and its plugins ask for
# 1.90). The landing page reads it from here.
rust-version = "1.90"
authors = ["Jorge Torres"]

[workspace.dependencies]
pty-core = { path = "crates/pty-core" }
portable-pty = "0.9"
parking_lot = "0.12"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
libc = "0.2"

# Release: maximum speed, small binary.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

# Dev: optimize dependencies so the terminal feels fast even in debug builds,
# while keeping our own crates quick to compile.
[profile.dev.package."*"]
opt-level = 2
