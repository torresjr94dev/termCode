[package]
name = "termcode"
description = "termCode: a fast, agent-aware terminal"
default-run = "termcode"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows (cargo#8519).
name = "termcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
pty-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
parking_lot.workspace = true
tauri-plugin-store = "2.5.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-log = "2.10.1"
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1.54.0", features = ["time", "sync", "macros"] }
