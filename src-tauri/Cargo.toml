[package]
name = "termcode"
description = "termCode: a fast, agent-aware terminal"
default-run = "termcode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows (cargo#8519).
name = "termcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
pty-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
parking_lot.workspace = true
tauri-plugin-store = "2.5.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-log = "2.10.1"
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1.54.0", features = ["time", "sync", "macros"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-updater = "2"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
# Named pipe del canal local (MCP y aprobaciones) con ACL solo del usuario,
# nombres cortos 8.3, búsqueda segura de DLLs, la build de Windows (registro)
# y Ctrl+C para las shells aunque quien abrió termCode lo ignore.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Registry",
] }

# libproc (macOS) y sysctl: archivos abiertos de Codex y presión de memoria.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# IOKit: uso de la GPU.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
